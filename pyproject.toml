[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-finance-ai"
version = "0.1.0"
description = "Real-Time Financial Markets Intelligence Chatbot for S&P 500 companies"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Your Name", email = "tgrady101@example.com"}
]
keywords = ["finance", "chatbot", "ai", "gemini", "adk", "sp500"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "google-adk>=1.19.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "fredapi>=0.5.0",
    "arize-otel>=0.4.0",
    "arize-phoenix>=4.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "google-cloud-discoveryengine>=0.11.0",
    "google-cloud-storage>=2.10.0",
    "google-genai>=0.2.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "markdownify>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/real-time-finance-ai"
Documentation = "https://github.com/yourusername/real-time-finance-ai#readme"
Repository = "https://github.com/yourusername/real-time-finance-ai"

[tool.setuptools.packages.find]
where = ["src"]
include = ["workflow_1*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
